name: Plugin checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python3 scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: carddesk-plugin-and-examples
          path: dist/*.zip
